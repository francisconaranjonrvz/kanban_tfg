# nginx como proxy inverso de Django + ACME challenge para Let's Encrypt.
#
# Modo HTTP-only: descomenta solo el bloque "server { listen 80 ... proxy }"
# (más abajo) y comenta el bloque HTTPS hasta tener certificados.
#
# Modo HTTPS (por defecto): el server :80 redirige a HTTPS salvo por la ruta
# /.well-known/acme-challenge/, que sirve los retos de validación de certbot.

events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 10M;

    upstream django_backend {
        server app:8000;
    }

    # ---------- HTTP: ACME challenge + redirect ----------
    server {
        listen 80;
        server_name _;

        # Reto HTTP-01 de Let's Encrypt — debe responder antes que el redirect.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Sin certificados aún: comenta este return y descomenta el `location /`
        # de abajo para servir directamente sobre HTTP.
        location / {
            return 301 https://$host$request_uri;
        }

        # location / {
        #     proxy_pass http://django_backend;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto http;
        # }
    }

    # ---------- HTTPS ----------
    # Comenta este bloque entero hasta haber generado los certificados,
    # o nginx no arrancará por falta de los .pem.
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        location / {
            proxy_pass http://django_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_redirect off;
        }
    }
}
