# Stack de producción: Django + PostgreSQL + nginx + certbot
#
# 1) cp .env.example .env  (y rellena los valores)
# 2) docker compose up -d --build
# 3) Para HTTPS: ./scripts/init-letsencrypt.sh

services:
  db:
    image: postgres:16-alpine
    container_name: kanban_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-kanban}
      POSTGRES_USER:     ${POSTGRES_USER:-kanban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [kanban_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-kanban} -d $${POSTGRES_DB:-kanban}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: kanban_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY:           ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS:        ${DOMAIN},.lhr.life,localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${DOMAIN},http://${DOMAIN}
      DJANGO_CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      DJANGO_SECURE_SSL_REDIRECT:  "False"
      DJANGO_HSTS_SECONDS:         "0"
      DJANGO_DB_ENGINE:  postgres
      POSTGRES_HOST:     db
      POSTGRES_PORT:     "5432"
      POSTGRES_DB:       ${POSTGRES_DB:-kanban}
      POSTGRES_USER:     ${POSTGRES_USER:-kanban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    expose:
      - "8000"
    networks: [kanban_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: kanban_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks: [kanban_net]

  certbot:
    image: certbot/certbot:latest
    container_name: kanban_certbot
    entrypoint: ["sleep", "infinity"]
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks: [kanban_net]

volumes:
  postgres_data:

networks:
  kanban_net:
    driver: bridge
